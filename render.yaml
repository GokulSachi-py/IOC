services:
  - type: web
    name: pulse-web
    runtime: static
    buildCommand: cd apps/web && npm install --include=dev && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pulse-api-mbhu.onrender.com

  - type: web
    name: pulse-api
    runtime: node
    buildCommand: cd apps/api && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd apps/api && npx prisma db push && npm run db:seed-exercises && npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://pulse-web-j59m.onrender.com
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString

databases:
  - name: pulse-db
    databaseName: pulse
    user: pulse
    plan: free
